<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>River Raid</title>
<!-- Cache-busting: ensure the user's browser does NOT hold on to an
     old dist/main-*.js after a bundle rebuild. The dev server also
     sends explicit no-cache headers (serve.py), but meta tags catch
     edge cases (server-side caching, overspecified shared hosting).
     When the bundle hash changes (e.g. dist/main-WAW7OWUE.js →
     dist/main-NEWHASH.js), the user's browser MUST re-fetch. -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- Prevent the /favicon.ico 404 noise in DevTools. -->
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: monospace;
  }
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    gap: 16px;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: 640px;
    height: 480px;
    background: #000;
    box-shadow: 0 0 32px rgba(0, 255, 0, 0.15);
    border: 2px solid #222;
  }
  .hud {
    font-size: 12px;
    color: #888;
    text-align: center;
    max-width: 640px;
  }
  .hud strong { color: #b4ffb4; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <strong>RIVER RAID</strong> — Atari 2600, 1982 &nbsp;&middot;&nbsp; JS port from JTZ disassembly (2001)
</div>

</body>
</html>
